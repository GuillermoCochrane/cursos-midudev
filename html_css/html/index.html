<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"> <!-- Codificación de caracteres -->
  <meta name="viewport" content="width=device-width">
  <title>Curso de HTML - Midudev</title>
  <meta name="description" content="Portafolio de Midudev, 15 años de experiencia como Ingeniero de Software."> <!-- Descripción de la página -->

  <!-- Open Graph  -->
  <!--https://www.opengraph.xyz/ para revisarlas -->
  <!-- https://ogp.me/  etiquetas disponibles -->

  <meta property="og:title" content="Portafolio de Midudev">
  <meta property="og:description" content="Portafolio de Midudev, 15 años de experiencia como Ingeniero de Software.">
  <meta property="og:image" content="assets/images/yo.jpg">
  <meta property="og:image:alt" content="Imagen de perfil de Midudev">

  <link rel="alternate" href="https://midu.dev/en" hreflang="en-GB"> <!-- Alternativas de la pagina en inglés -->
  <link rel="alternate" href="https://midu.dev/es" hreflang="es-ES"> <!-- Alternativas de la pagina en español -->
  <link rel="canonical" href="https://midu.dev/"> <!-- Página original -->

  <meta name="robots" content="index, follow"> <!-- Robots, importante para las busquedas -->
  <meta name="theme-color" content="#09f"> <!-- Color de fondo -->
  <link rel="icon" href="https://midu.dev/favicon.svg" type="image/svg+xml"> <!-- Favicon de la página -->
  <style>
    body {
      background-color: #09f;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Headings, párrafos, strong y listas -->
  <h1>Portfolio de Midudev</h1>

  <h2>Experiencia</h2>
  <ul>
    <li>Adevinta - 2022</li>

  <!-- Elementos de reemplazo y buenas prácticas -->
  <img 
    width=200 
    height=200
    src="assets/images/yo.jpg" 
    alt="Imagen de perfil de Midudev" 
    title="Imagen de perfil de Midudev" 
  >

</html>
