<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://midu.dev/favicon.svg" type="image/svg+xml" />
  <title>Clase 3 — Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #ccc;
    }

    section {
      padding: 1rem;
      background-color: #ddd;
      margin-block: 1rem;
    }

    .grid {
      background: lightsalmon;
      border: 3px solid #000;
      margin: 0 auto;
      width: 300px;
      border-radius: 10px;
      display: grid;
    }

    .grid div {
      background-color: lightblue;
      border: 2px solid #09f;
      border-radius: 6px;
    }

    /* Grid básico */
    .grid-e1 {
      grid-template-columns: auto auto 20px;
      /* grid-template-columns define las columnas de la grilla, y el ancho de cada columna */
      /* auto ajusta el ancho de la columna al espacio libre de la grilla y al contenido de los elementos */
    }

    /* Columnas, fr y filas */
    .grid-e2 {
      /* grid-template-columns:  50% 100px auto 10vw;  */
      /* Se puede mezclar unidades sin ningun tipo de problemas */
      /* fr es la unidad que nos permite definir el tamaño de las columnas de forma proporcional al tamaño disponible */
      /* por ejemplo si tenemos grid-template-columns:  1fr 100px, 1fr = 100% - 100px */
      grid-template-columns: 1fr 2fr;
      /* grid-template-rows: nos permite definir el tamaño de las filas de la grilla */
      grid-template-rows: 100px 50px 30px 100px 50px;
      /* si agregamos mas filas que contenido, se agregarán filas vacías. Se puede crear una grilla vacia. Los elemento ni su cantidad no definen el tamaño de la grilla */
      /* grid-auto-rows:  200px; nos permite definir el tamaño de las filas de la grilla, que no se hayan especificado en grid-template-rows */
    }

    /* Repeat, auto-fill y auto-fit */
    .grid-e3 {
      grid-template-columns: repeat(3, 1fr);
      /*  es igual a grid-template-columns:  1fr 1fr 1fr */
      /* se puede usar de forma parcial:  grid-template-columns: 25px repeat(3, 1fr) 25px;  */
      /* se puede usar con para repetir varias columnas:  grid-template-rows: repeat(3, 25px 50px) ;  */
      grid-template-rows: repeat(3, 100px);
      /*  es igual a grid-template-rows:  100px 100px 100px */
    }

    /* minmax */
    .grid-e4 {
      grid-template-columns: minmax(100px, 1fr) 1fr 1fr;
      /*  cuando el tamaño de la columna sea menor que 100px, el ancho sera 100px, si es mayor, se comportara como 1fr  (es similar al min-width) */
    }

    /* Auto-fill, auto-fit, gap */
    .grid-e5 {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, 
        minmax(200px, 1fr)
        );
        /*  auto-fill: nos permite que se vayan agregando columnas cuando el se supera el tamaño minimo del elemento. Los elementos "crecen" hasta que el contenido se supere el tamaño minimo para una nueva columna (por el minmax()) */
        /* auto-fit: nos permite que si no hay mas elementos, el tamaño de los elementos se ajuste a la grilla */
      gap: 16px; /* 16px de espacio entre elementos */
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .grid-e5 img {
      border-radius: 8px;
      width: 100%;
      height: auto;
    }

    /* Posicionamiento explícito */
    .grid-e6 {
      grid-template-columns: minmax(100px, 1fr) 1fr 1fr;
      gap: 4px;
      grid-auto-rows: 50px;
    }

    .grid-e6 div:first-child {
      background-color: lightgreen;
      border: 2px solid green;
      grid-column-start: 1; /* Grid-column-start define la columna inicial en la cual se colocará el elemento */
      grid-column-end: 3; /* Grid-column-end define la columna final en la cual se colocará el elemento */
      grid-row-start: 1; /* Grid-row-start define la fila inicial en la cual se colocará el elemento */
      grid-row-end: 2; /* Grid-row-end define la fila final en la cual se colocará el elemento */
      /* se puede usar para dejar vacío partes de la grilla */
      /* como se define de forma explicita la posicion inicial y final del elemento, estos  puedem ir en cualquier orden dentro de la grilla */
    }
    .grid-e6 div:nth-child(2) {
      background-color: goldenrod;
      border: 2px solid yellow;
      grid-column-start: 3; /* grid-column-start define la columna inicial en la cual se colocará el elemento */
      grid-row-start:  1; /* grid-row-start define la fila inicial en la cual se colocará el elemento */
      grid-row-end: 3; /* grid-row-end define la fila final en la cual se colocará el elemento */
    }

    .grid-e6 div:nth-child(3) {
      background-color: lightseaGreen;
      border: 2px solid blue;
      grid-column-start: span 2; /* con span, se puede especificar el número de filas o columnas que se van a ocupar */
      grid-row-start: span 2;
    }

    .grid-e6 div:nth-child(4) {
      background-color: lightcoral;
      border: 2px solid red;
      grid-column: 2 / 4; /* grid-column define la columna inicial y final en la cual se colocará el elemento */
      grid-row: 4 / 5; /* grid-row define la fila inicial y final en la cual se colocará el elemento */
    }

    .grid-e6 div:nth-child(5) {
      background-color: mediumpurple;
      border: 2px solid purple;
      grid-column: 1 / -1; /* se pueden usar numero negativo para indicar el final de la columna (1 /-1 indica que ocupa todas las columnas) */
      grid-row: 5 / 6;
    }

    .grid-e6 div:nth-child(6) {
      background-color: lightgray;
      border: 2px solid darkslategrey;
      grid-column: 1/3;
      grid-row: 1/2;
      opacity: 0.7;
      text-align: right;
      /* los elementos de grid se pueden superponer */
    }

    /* layout responsive */
    @media (width > 500px) {
      .grid-e6 {
        grid-template-columns: minmax(200px, 1fr) 1fr 1fr;
      }
    }

  </style>
</head>

<body>
  <header>
    <h1>Clase 3 — Grid</h1>
  </header>
  <main>
    <section>
      <h2>Ejemplo 1: Grid Básico</h2>
      <div class="grid grid-e1">
        <div>1asdasdasd</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
    <section>
      <h2>Ejemplo 2: Columnas, fr y filas </h2>
      <div class="grid grid-e2">
        <div>1asdasdasd</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
    <section>
      <h2>Ejemplo 3: Repeat, auto-fill y auto-fit </h2>
      <div class="grid grid-e3">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
    <section>
      <h2>Ejemplo 4: Minmax </h2>
      <div class="grid grid-e4">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
    <section>
      <h2>Ejemplo 5: Auto-fill y auto-fit </h2>
      <div class="grid grid-e5">
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
        <img src='https://m.media-amazon.com/images/I/91xCWjZ2IIL._AC_UF894,1000_QL80_.jpg'>
      </div>
    </section>
    <section>
      <h2>Ejemplo 6: Posicionamiento explícito </h2>
      <div class="grid grid-e6">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
  </main>
</body>

</html>
