<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://midu.dev/favicon.svg" type="image/svg+xml" />
  <title>Clase 3 — Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #ccc;
    }

    section {
      padding: 1rem;
      background-color: #ddd;
      margin-block: 1rem;
    }
    
    .grid {
      background: lightsalmon;
      border: 3px solid #000;
      margin: 0 auto;
      width: 300px;
      border-radius: 10px;
      display: grid;
    }

    .grid div {
      background-color: lightblue;
      border: 2px solid #09f;
      border-radius: 6px;
    }

    /* Grid básico */
    .grid-e1 {
      grid-template-columns:  auto auto 20px; 
      /* grid-template-columns define las columnas de la grilla, y el ancho de cada columna */
      /* auto ajusta el ancho de la columna al espacio libre de la grilla y al contenido de los elementos */
    }

  </style>
</head>

<body>
  <header>
    <h1>Clase 3 — Grid</h1>
  </header>
  <main>
    <section>
      <h2>Ejemplo 1: Grid Básico</h2>
      <div class="grid grid-e1">
        <div>1asdasdasd</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
      </div>
    </section>
  </main>
</body>

</html>
